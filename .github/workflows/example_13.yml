name: Build Matrix Upload + E2E Download

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Build dummy artifact
        run: |
          mkdir -p dist
          echo "artifact for python-${{ matrix.python-version }}" > dist/info.txt
          zip -r dist-python-${{ matrix.python-version }}.zip dist

      - name: Upload artifact for this matrix entry
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: dist-python-${{ matrix.python-version }}.zip

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Python 3.11 artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-3.11
          path: downloaded

      - name: Show artifact contents
        run: |
          echo "Files downloaded:"
          ls -la downloaded || true
          unzip downloaded/dist-python-3.11.zip -d downloaded/unzipped || true
          cat downloaded/unzipped/dist/info.txt || true

      - name: Run simple E2E step
        run: echo "E2E would run using the downloaded artifact"
