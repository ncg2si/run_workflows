name: Max Parallel Matrix Example

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        python-version: ["3.8","3.9","3.10","3.11","3.12","3.7"]
      max-parallel: 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print python-version
        run: echo "Running for python ${{ matrix.python-version }}"
