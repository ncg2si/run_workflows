name: OIDC AWS Deploy Example

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::502147243508:role/github-actions
          aws-region: eu-central-1

      - name: List S3 buckets (example)
        run: aws s3 ls
