name: Concurrency Example

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  one:
    runs-on: ubuntu-latest
    steps:
      - name: Show concurrency
        run: |
          echo "This run is in concurrency group: ${{ github.workflow }}-${{ github.ref }}"
